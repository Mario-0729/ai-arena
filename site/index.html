<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AI 吵架擂台</title>
<style>
:root{--bg:#0d0f14;--panel:#161a22;--panel2:#1d2230;--line:#2a3142;--text:#e9ecf2;--muted:#8b93a7;--accent:#ff5d3a;--gold:#ffc53d;--pro:#4c8dff;--con:#ff5a6e;--ok:#37c28a}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f8;--panel:#fff;--panel2:#f0f2f6;--line:#e2e5ec;--text:#161a22;--muted:#69718a;--gold:#b7791f;--pro:#2563eb;--con:#dc2649;--ok:#14895b}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button,textarea,select,input{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(48px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 18px}
.logo{font-weight:900;font-size:24px;letter-spacing:.5px}
.logo span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--panel2);color:var(--c,var(--muted));white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2.h{margin:0 0 10px;font-size:13px;color:var(--muted)}
.card h2.h:not(:first-child){margin-top:20px}
.item{display:block;padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:4px}
.item .t{font-weight:700;line-height:1.45}
.item .m{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.win{font-weight:800;color:var(--c)}
.back{display:inline-block;margin-bottom:12px;color:var(--muted);font-size:14px}
.topic{font-size:21px;font-weight:800;line-height:1.4;margin:4px 0 10px}
.meta{font-size:13px;color:var(--muted)}
.roster{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--c);color:var(--c)}
.round{margin:20px 0 8px;font-size:12px;font-weight:800;color:var(--gold);letter-spacing:1px}
.msg{display:flex;gap:10px;margin:10px 0}
.av{flex:0 0 36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:15px;color:#fff;background:var(--c)}
.bub{flex:1;min-width:0;background:var(--panel2);border-radius:4px 14px 14px 14px;padding:9px 12px;border-left:3px solid var(--c)}
.who{font-size:12px;font-weight:800;color:var(--c);margin-bottom:2px}
.say{white-space:pre-wrap;word-break:break-word}
.verdict{border:1px solid var(--gold);background:linear-gradient(135deg,rgba(255,197,61,.12),transparent)}
.verdict h2{margin:0 0 6px;font-size:14px;color:var(--gold)}
.raw{white-space:pre-wrap;word-break:break-word;font-size:15px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.nav a{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;font-weight:700;text-align:center}
.nav a.off{visibility:hidden}
.now .t{font-weight:800;font-size:18px;line-height:1.45;display:block}
.now .m{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:800;font-size:16px;cursor:pointer;padding:0 12px}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.stop{color:var(--con);border-color:var(--con)}
.btn:disabled{opacity:.5;cursor:default}
textarea,input[type=password],select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
textarea{min-height:84px;resize:vertical;display:block}
label.sel{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}
label.sel select{flex:1;width:auto}
.note{margin-top:10px;font-size:13px;color:var(--muted)}
.note.err{color:var(--con)}
.note.ok{color:var(--ok)}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer}
.live{color:var(--muted);text-align:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.running .dot{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.feed{margin-top:8px}
.more{display:inline-block;margin-top:2px;font-size:13px;font-weight:700;color:var(--muted)}
.note.status{color:var(--text)}
.thinking .bub{opacity:.75}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
.qhead{margin-bottom:6px}
.qrow{margin-top:10px}
.qtop{display:flex;justify-content:space-between;font-size:14px}
.qtop span{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.qsub{font-size:12px;color:var(--muted);margin-top:4px}
.card.live.err{color:var(--con)}
h2.sec{font-size:13px;color:var(--muted);margin:22px 4px 10px;font-weight:700}
.role{font-weight:600;opacity:.8}
.cite{margin-left:8px;font-size:11px;font-weight:800;color:#1a1300;background:var(--gold);border-radius:6px;padding:1px 6px}
.say strong{font-weight:800;background:linear-gradient(transparent 58%,rgba(255,197,61,.45) 58%)}
.msg.cited .bub{box-shadow:0 0 0 2px var(--gold)}
.msg.flash .bub{animation:flash 1.6s}
@keyframes flash{0%,60%{background:rgba(255,197,61,.35)}}
.score{margin:10px 0 10px 46px;padding:9px 12px;border-radius:12px;border:1px dashed var(--gold);font-size:14px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh b{color:var(--gold);font-size:12px;white-space:nowrap}
.sp{white-space:nowrap}
.sp em{font-style:normal;font-weight:700}
.sp em.lead{font-weight:900;font-size:16px}
.sn{color:var(--muted);margin-top:4px}
.board{margin:12px 0 4px}
.bl{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.bl span{font-size:12px;color:var(--muted)}
.bbar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:6px;background:var(--panel2)}
.bbar i{display:block;height:100%}
.verdict h3{margin:14px 0 6px;font-size:13px;color:var(--gold)}
.quote{display:block;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.quote b{margin-right:6px;font-size:13px}
.clamp{display:block}
.clamp .say{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btn.fold{width:100%;margin:10px 0 4px;min-height:40px;font-size:14px;color:var(--muted)}
.bulk{margin:-4px 0 14px}
.bulk .row{margin-top:0}
.bulk .btn{font-size:14px;padding:0 6px}
.qmini{position:fixed;top:calc(10px + env(safe-area-inset-top));right:max(12px,calc((100vw - 720px) / 2 + 12px));z-index:20}
.qbtn{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.qm{display:flex;align-items:center;gap:5px;font-size:11px;line-height:1.5}
.qk{color:var(--muted);width:20px;text-align:left}
.qb{width:44px;height:5px;border-radius:9px;background:var(--panel2);overflow:hidden;display:inline-block}
.qb i{display:block;height:100%}
.qv{font-weight:800;width:30px;text-align:right}
.qd{margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;width:220px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.qd b{display:block;margin-bottom:4px;color:var(--muted);font-size:12px}
header{padding-right:120px}
.clamp .say{-webkit-line-clamp:2}
.jr{display:flex;gap:8px;align-items:baseline;font-size:13px;margin-top:4px}
.jn{color:var(--muted);flex:0 0 auto;white-space:nowrap}
.js{flex:0 0 auto;font-weight:700}
.js em{font-style:normal}
.jc{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.votes{display:flex;gap:6px;margin:4px 0 10px}
.vote{display:inline-flex;gap:4px;align-items:center;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--c);color:var(--muted)}
.vote b{color:var(--c)}
.bdr{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.bdr em{font-style:normal;font-weight:800;width:18px;text-align:center}
.bdr .bbar{flex:1;margin:0}
.bdk{width:34px;color:var(--muted);font-size:13px}
.msg.best .bub{box-shadow:0 0 0 2px var(--accent)}
.cite.bestb{background:var(--accent);color:#fff}
.bestq{font-weight:700}
.bp{margin-top:4px;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="#/">
      <div class="logo">AI <span>吵架</span>擂台</div>
      <div class="sub">你出題，Claude 自己跟自己吵</div>
    </a>
  </header>
  <div id="quota" class="qmini"></div>
  <main id="app"><div class="empty">擂台布置中…</div></main>
  <footer>所有發言由 Claude 生成，純屬娛樂</footer>
</div>
<script>
const REPO = "Mario-0729/ai-arena";
const WORKFLOW = "arena.yml";
const TOKEN_KEY = "arena-gh-token";
const API = "https://api.github.com/repos/" + REPO;
const POLL_MS = 10000;
const MAX_ACTIVE = 20; // 最多同時打幾場（GitHub 免費最多同時 20 台機器）

const PLAYERS = {
  正方: "var(--pro)", 反方: "var(--con)", 評審: "var(--gold)",
  // 舊玩法（五個 AI 角色）的場次
  GPT: "#10A37F", Gemini: "#4285F4", Grok: "#8B8F98", DeepSeek: "#4D6BFE", Claude: "#D97757",
};
const color = (name) => PLAYERS[name] || "#9b7bd6";

const STATUS = {
  running: { text: "進行中", c: "var(--ok)" },
  paused: { text: "已暫停", c: "var(--gold)" },
  ending: { text: "結算中", c: "var(--gold)" },
  stopped: { text: "中斷", c: "var(--muted)" },
  ended: { text: "已結束", c: "var(--muted)" },
};

const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (v != null && v !== false) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
};

// 只處理 **粗體**，其餘一律當純文字（不用 innerHTML）
function rich(text) {
  const out = [];
  String(text).split(/(\*\*[^*]+\*\*)/g).forEach((part) => {
    if (/^\*\*[^*]+\*\*$/.test(part)) out.push($("strong", {}, part.slice(2, -2)));
    else if (part) out.push(part.replace(/\*\*/g, ""));
  });
  return out;
}

// ---------- 權杖（只存在這支手機的瀏覽器） ----------
let MEM_TOKEN = "";
function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return MEM_TOKEN; } }
function setToken(t) { MEM_TOKEN = t; try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

async function gh(path, opts = {}, raw = false) {
  let res;
  try {
    res = await fetch(API + path, {
      ...opts,
      cache: "no-store",
      headers: {
        Accept: raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
        Authorization: "Bearer " + getToken(),
        "X-GitHub-Api-Version": "2022-11-28",
        ...(opts.body ? { "Content-Type": "application/json" } : {}),
      },
    });
  } catch (e) {
    throw new Error("連不上 GitHub，請檢查網路");
  }
  if (res.ok) return res.status === 204 ? null : res.json();
  const err = new Error(
    res.status === 401 ? "權杖無效或已過期，請重新設定" :
    res.status === 403 || res.status === 404 ? "權杖沒有這個 repo 的權限（Contents 和 Actions 都要選 Read and write）" :
    "GitHub 回應錯誤 " + res.status);
  err.status = res.status;
  throw err;
}

const b64encode = (s) => { let bin = ""; new TextEncoder().encode(s).forEach((b) => { bin += String.fromCharCode(b); }); return btoa(bin); };
const b64decode = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), (c) => c.charCodeAt(0)));

// 每一場有自己的控制檔 controls/<id>.json
async function controlSha(id) {
  try {
    return (await gh("/contents/controls/" + id + ".json?ref=main")).sha;
  } catch (e) {
    if (e.status === 404) return null;
    throw e;
  }
}

async function writeControl(ctrl, label) {
  for (let i = 0; i < 2; i++) {
    const sha = await controlSha(ctrl.id);
    try {
      await gh("/contents/controls/" + ctrl.id + ".json", {
        method: "PUT",
        body: JSON.stringify({
          message: "控制：" + label + " " + ctrl.id,
          content: b64encode(JSON.stringify(ctrl, null, 2) + "\n"),
          branch: "main",
          ...(sha ? { sha } : {}),
        }),
      });
      return;
    } catch (e) {
      if (e.status !== 409 || i) throw e; // 409：剛好被改過，重抓一次
    }
  }
}

const dispatch = (id) => gh("/actions/workflows/" + WORKFLOW + "/dispatches",
  { method: "POST", body: JSON.stringify({ ref: "main", inputs: { id } }) });

function taipeiParts(date) {
  const p = {};
  new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" })
    .formatToParts(date).forEach((x) => { p[x.type] = x.value; });
  return p;
}
function taipeiStamp() {
  const p = taipeiParts(new Date());
  return `${p.year}-${p.month}-${p.day}_${p.hour}${p.minute}${p.second}`;
}

// ---------- 狀態 ----------
let DATA = [];      // 各場次
let LIVE = [];      // 還沒結束的場次（data.json 的 live）
let QUOTA = null;   // Claude 最近一次回報的額度
let PENDING = {};   // 剛按的按鈕，GitHub 資料還沒跟上前先照這個顯示：id → { ctrl, at }
let RUNS = {};      // 每一場最近一次執行（有權杖才讀得到）：id → run
let NOTE = null;    // { text, kind }
let BUSY = false;
let SHOW_TOKEN_FORM = false;
let DRAFT = "";
let MAX = "3";
let SHOW_N = 10;      // 所有場次先顯示幾場

// 下一步（data.json 的 live.next；剛按開始還沒資料時當作正方立論）
function nextOf(cur) {
  return cur.next || { kind: "speech", stage: "立論", who: "正方", role: "立論" };
}
function nextLabel(n) {
  if (n.kind === "speech") return `${n.stage}・${n.who}${n.role && n.role !== n.stage ? "（" + n.role + "）" : ""}`;
  if (n.kind === "score") return `評審為「${n.stage}」打分`;
  return "評審判決";
}
function progressText(cur) {
  if (!cur.stage) return cur.max ? `自由辯論 ${cur.max} 來回` : "自由辯論無上限";
  if (cur.stage === "自由辯論") return cur.max ? `自由辯論 第 ${cur.free}／${cur.max} 來回` : `自由辯論 第 ${cur.free} 來回・無上限`;
  return `${cur.stage}階段`;
}

// 一場的即時狀態：剛按的按鈕優先，其次 data.json
function view(base) {
  const d = DATA.find((x) => x.id === base.id);
  let status;
  if (d && d.verdict) status = "ended";
  else status = { run: "running", pause: "paused", end: "ending", stop: "stopped" }[base.cmd] || "paused";
  return { ...base, max: Number(base.max) || 0, status, debate: d };
}

// 還沒結束的場次（新的在上面）
function actives() {
  const byId = {};
  LIVE.forEach((l) => { byId[l.id] = l; });
  for (const [id, p] of Object.entries(PENDING)) {
    const l = byId[id];
    const synced = l ? l.cmd === p.ctrl.cmd : DATA.some((d) => d.id === id && d.verdict);
    if (synced || Date.now() - p.at > 180000) delete PENDING[id];
    else byId[id] = { ...(l || {}), ...p.ctrl };
  }
  return Object.values(byId).map(view).filter((v) => v.status !== "ended" && v.status !== "stopped")
    .sort((a, b) => (a.id < b.id ? 1 : -1));
}
const findActive = (id) => actives().find((v) => v.id === id) || null;

// 卡住：最近一次執行失敗（例如額度用完），或結算中卻沒有任何執行在跑
function isStuck(v) {
  const r = RUNS[v.id];
  if (v.status !== "running" && v.status !== "ending") return false;
  if (r) return r.status === "completed" && r.conclusion === "failure";
  return v.status === "ending" && !PENDING[v.id] && !!getToken();
}

const CMD = { pause: "pause", resume: "run", end: "end", stop: "stop" };
const LABEL = { pause: "暫停", resume: "繼續", end: "結束", stop: "放棄", retry: "重試" };
const DONE = {
  pause: "已暫停。正在講的那一段會講完，之後停下。",
  resume: "已送出，接著打。",
  end: "已送出，準備結辯和判決。",
  stop: "已放棄這場，不會判決，也不會再用額度。",
  retry: "已重新啟動，從卡住的地方接著做。",
};

// 送出一場的指令；retry 不改控制檔，只重新觸發
async function sendOne(v, kind, prefix = "") {
  if (kind !== "retry") {
    const ctrl = { id: v.id, topic: v.topic, max: v.max, cmd: CMD[kind] };
    await writeControl(ctrl, prefix + LABEL[kind]);
    PENDING[v.id] = { ctrl, at: Date.now() };
  }
  await dispatch(v.id);
  delete RUNS[v.id];
}

async function act(kind, id) {
  if (kind === "start") return startMany();
  const cur = findActive(id);
  if (!cur) return;
  if (kind === "end" && !confirm("確定要結束「" + cur.topic + "」？會先打分、雙方結辯，再由評審判決。")) return;
  if (kind === "stop" && !confirm("放棄「" + cur.topic + "」？不會判決，也不會再用額度。")) return;
  BUSY = true; NOTE = { text: "送出中…", kind: "" }; render();
  try {
    await sendOne(cur, kind);
    NOTE = { text: DONE[kind], kind: "ok" };
  } catch (e) {
    NOTE = { text: e.message, kind: "err" };
  }
  BUSY = false;
  render();
  schedulePoll(1500);
}

// 一鍵全部暫停／繼續／結束
let BULK_NOTE = null;
async function actAll(kind) {
  const list = actives();
  const targets = list.filter((v) =>
    kind === "pause" ? v.status === "running" && !isStuck(v) :
    kind === "resume" ? v.status === "paused" :
    kind === "end" ? v.status === "running" || v.status === "paused" :
    isStuck(v)); // retry、stop 只對卡住的
  if (!targets.length) return;
  const label = LABEL[kind];
  if (kind === "end" && !confirm(`結束全部 ${targets.length} 場？每場會先打分、雙方結辯，再由評審判決。`)) return;
  if (kind === "stop" && !confirm(`放棄卡住的 ${targets.length} 場？不會判決，也不會再用額度。`)) return;
  if (kind === "retry" && !confirm(`重試卡住的 ${targets.length} 場？每場會接著用額度把剩下的步驟做完。`)) return;
  BUSY = true;
  let ok = 0;
  const failed = [];
  for (const v of targets) {
    BULK_NOTE = { text: `${label}中 ${ok + failed.length + 1}／${targets.length}…`, kind: "" };
    render();
    try {
      await sendOne(v, kind, "全部");
      ok++;
    } catch (e) {
      failed.push(v.topic + "（" + e.message + "）");
    }
  }
  BULK_NOTE = failed.length
    ? { text: `已${label} ${ok} 場，${failed.length} 場失敗：${failed.join("、")}`, kind: "err" }
    : { text: `已${label} ${ok} 場。`, kind: "ok" };
  BUSY = false;
  render();
  schedulePoll(1500);
}

function bulkBar(list) {
  if (!getToken()) return null;
  const stuck = list.filter(isStuck).length;
  const running = list.filter((v) => v.status === "running" && !isStuck(v)).length;
  const paused = list.filter((v) => v.status === "paused").length;
  const endable = list.filter((v) => v.status === "running" || v.status === "paused").length;
  const rows = [];
  if (list.length >= 2) {
    const btns = [];
    if (running) btns.push($("button", { class: "btn", disabled: BUSY, onclick: () => actAll("pause") }, `全部暫停（${running}）`));
    if (paused) btns.push($("button", { class: "btn go", disabled: BUSY, onclick: () => actAll("resume") }, `全部繼續（${paused}）`));
    if (endable) btns.push($("button", { class: "btn stop", disabled: BUSY, onclick: () => actAll("end") }, `全部結束（${endable}）`));
    if (btns.length) rows.push($("div", { class: "row" }, btns));
  }
  if (stuck >= 2) {
    rows.push($("div", { class: "row" },
      $("button", { class: "btn", disabled: BUSY, onclick: () => actAll("retry") }, `重試卡住的（${stuck}）`),
      $("button", { class: "btn stop", disabled: BUSY, onclick: () => actAll("stop") }, `放棄卡住的（${stuck}）`)));
  }
  if (!rows.length && !BULK_NOTE) return null;
  return $("div", { class: "bulk" }, rows, BULK_NOTE ? $("div", { class: "note " + BULK_NOTE.kind }, BULK_NOTE.text) : null);
}

// 一行一題，一次開很多場，同時打
async function startMany() {
  const lines = [...new Set(DRAFT.split(/\n+/).map((t) => t.replace(/\s+/g, " ").trim()).filter(Boolean))];
  if (!lines.length) { NOTE = { text: "先輸入辯題，一行一題", kind: "err" }; return render(); }
  const room = MAX_ACTIVE - actives().filter((v) => v.status !== "paused").length;
  if (lines.length > room) {
    NOTE = { text: `最多同時打 ${MAX_ACTIVE} 場，現在還能開 ${Math.max(0, room)} 場。可以先結束或暫停幾場。`, kind: "err" };
    return render();
  }
  if (MAX === "0" && lines.length > 1 && !confirm(`${lines.length} 場無限辯論會一起燒額度，直到你一場一場按結束。確定？`)) return;
  const stamp = taipeiStamp();
  BUSY = true; render();
  let ok = 0;
  try {
    for (const [i, topic] of lines.entries()) {
      NOTE = { text: `送出中 ${i + 1}／${lines.length}…`, kind: "" }; render();
      const ctrl = { id: lines.length > 1 ? `${stamp}-${i + 1}` : stamp, topic: topic.slice(0, 200), cmd: "run", max: Number(MAX) };
      await writeControl(ctrl, "開始");
      await dispatch(ctrl.id);
      PENDING[ctrl.id] = { ctrl, at: Date.now() };
      ok++;
    }
    DRAFT = "";
    NOTE = { text: lines.length > 1 ? `${lines.length} 場同時開打。` : "已送出，正方準備開口。", kind: "ok" };
  } catch (e) {
    NOTE = { text: (ok ? `已開 ${ok} 場，第 ${ok + 1} 場失敗：` : "") + e.message, kind: "err" };
  }
  BUSY = false;
  render();
  schedulePoll(1500);
}

async function saveToken(value) {
  const t = value.trim();
  if (!t) return;
  setToken(t);
  BUSY = true; NOTE = { text: "檢查權杖…", kind: "" }; render();
  try {
    await gh("");
    SHOW_TOKEN_FORM = false;
    NOTE = { text: "權杖可以用了", kind: "ok" };
    await load();
  } catch (e) {
    setToken("");
    NOTE = { text: e.message, kind: "err" };
  }
  BUSY = false;
  render();
  schedulePoll();
}

function ago(iso) {
  const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  return s < 60 ? s + " 秒" : Math.round(s / 60) + " 分鐘";
}

// 一句話說明現在在幹嘛
function statusLine(cur) {
  const RUN = RUNS[cur.id] || null;
  if (cur.status === "paused") return { text: "已暫停。按「繼續」接著打；按「結束」會先打分、雙方結辯，再由評審判決。" };
  const n = nextOf(cur);
  const who = nextLabel(n);
  const doing = n.kind === "speech" ? `${who} 正在想` : n.kind === "score" ? `評審正在為「${n.stage}」打分` : "評審正在判決";
  if (!RUN) return isStuck(cur) ? { text: "卡住了，沒有在跑。可以按「重試」接著做，或「放棄」不判決。", err: true } : { text: doing + "…" };
  if (RUN.status === "completed" && RUN.conclusion === "failure") {
    return { text: "卡住了（上一步失敗，常見原因是額度用完）。可以按「重試」接著做，或「放棄」不判決。", link: RUN.html_url, err: true };
  }
  if (/queued|pending|waiting|requested/.test(RUN.status)) {
    return { text: `排隊中，等 GitHub 派機器（已等 ${ago(RUN.created_at)}）。下一位：${who}` };
  }
  if (RUN.status === "in_progress") return { text: `${doing}…（已 ${ago(RUN.run_started_at || RUN.created_at)}）` };
  return { text: `準備下一位：${who}…` };
}

let QUOTA_OPEN = false;
function quotaRows() {
  const q = QUOTA && QUOTA.info;
  if (!q) return [];
  const NAMES = { five_hour: "5 小時", seven_day: "7 天", seven_day_opus: "7 天 Opus", seven_day_sonnet: "7 天 Sonnet" };
  const SHORT = { five_hour: "5h", seven_day: "7d", seven_day_opus: "7d O", seven_day_sonnet: "7d S" };
  const pct = (u) => (u == null ? null : Math.round(u <= 1 ? u * 100 : u));
  const reset = (t) => {
    if (!t) return "";
    const p = taipeiParts(new Date(t < 1e12 ? t * 1000 : t));
    return `${Number(p.month)}/${Number(p.day)} ${p.hour}:${p.minute} 重置`;
  };
  const rows = [];
  const windows = q.unifiedWindows && typeof q.unifiedWindows === "object" ? q.unifiedWindows : {};
  for (const [k, w] of Object.entries(windows)) {
    if (w && typeof w === "object") rows.push({ name: NAMES[k] || k, short: SHORT[k] || k, pct: pct(w.utilization), reset: reset(w.resetsAt) });
  }
  if (!rows.length) rows.push({ name: NAMES[q.rateLimitType] || "目前", short: SHORT[q.rateLimitType] || "用量", pct: pct(q.utilization), reset: reset(q.resetsAt) });
  return rows;
}
function renderQuota() {
  const box = document.getElementById("quota");
  if (!box) return;
  const rows = quotaRows();
  const col = (p) => (p == null ? "var(--muted)" : p >= 90 ? "var(--con)" : p >= 70 ? "var(--gold)" : "var(--ok)");
  const mini = rows.length
    ? rows.slice(0, 2).map((r) => $("div", { class: "qm" }, $("span", { class: "qk" }, r.short),
        $("span", { class: "qb" }, $("i", { style: `width:${Math.min(100, r.pct || 0)}%;background:${col(r.pct)}` })),
        $("span", { class: "qv", style: "color:" + col(r.pct) }, r.pct == null ? "–" : r.pct + "%")))
    : [$("div", { class: "qm" }, $("span", { class: "qk" }, "額度"), $("span", { class: "qv" }, "–"))];
  const detail = QUOTA_OPEN ? $("div", { class: "qd" },
    $("b", {}, "Claude 額度"),
    rows.length ? rows.map((r) => $("div", {}, `${r.name}：${r.pct == null ? "–" : "已用 " + r.pct + "%"}${r.reset ? "，" + r.reset : ""}`))
      : $("div", {}, "還沒有資料，下一次發言後才會出現。"),
    QUOTA ? $("div", { class: "qsub" }, "更新於 " + QUOTA.at + "。跟你平常用 Claude 共用。") : null) : null;
  box.replaceChildren($("button", { class: "qbtn", "aria-label": "Claude 額度", onclick: () => { QUOTA_OPEN = !QUOTA_OPEN; renderQuota(); } }, mini), ...(detail ? [detail] : []));
}

// 戰績：只算正反方賽制的場次
function statsCard() {
  const done = DATA.filter((d) => ["正方", "反方", "平手"].includes(d.winner));
  if (!done.length) return null;
  const n = (w) => done.filter((d) => d.winner === w).length;
  const pro = n("正方"), con = n("反方"), tie = n("平手");
  const scored = done.filter((d) => d.totals && d.totals.n);
  const avg = (k) => scored.length ? Math.round(scored.reduce((a, d) => a + d.totals[k], 0) / scored.length) : 0;
  const splits = done.filter((d) => d.split);
  const sweep = splits.filter((d) => /3：0/.test(d.split)).length;
  const pct = (x) => Math.round((x / done.length) * 100);
  return $("div", { class: "card" }, $("h2", { class: "h" }, `戰績（${done.length} 場）`),
    $("div", { class: "bl" }, $("b", { style: "color:var(--pro)" }, `正方 ${pro} 勝`), $("span", {}, tie ? `平手 ${tie}` : ""), $("b", { style: "color:var(--con)" }, `${con} 勝 反方`)),
    $("div", { class: "bbar" }, $("i", { style: `width:${pct(pro)}%;background:var(--pro)` }), $("i", { style: `width:${pct(tie)}%;background:var(--muted)` }), $("i", { style: `width:${pct(con)}%;background:var(--con)` })),
    $("div", { class: "note" }, [
      `正方勝率 ${pct(pro)}%`,
      scored.length ? `平均比分 ${avg("pro")}：${avg("con")}` : "",
      splits.length ? `評審團 ${splits.length} 場中一致通過 ${sweep} 場` : "",
    ].filter(Boolean).join("・")));
}

function isBest(d, m) {
  const norm = (t) => String(t).replace(/\*\*/g, "").replace(/\s+/g, "");
  return !!(d.best && d.best.who === m.who && d.best.text && norm(m.text).includes(norm(d.best.text)));
}

function jumpTo(id, k) {
  const el = document.querySelector(k === "best" ? "[data-best]" : `[data-cite="${k}"]`);
  if (el) {
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1600);
  }
}

function detailView(id) {
  const i = DATA.findIndex((d) => d.id === id);
  const cur = findActive(id);
  const isCur = !!cur;
  if (i < 0) {
    return [$("a", { class: "back", href: "#/" }, "← 回列表"),
      $("div", { class: "card" }, isCur ? $("div", { class: "topic" }, cur.topic) : null,
        isCur ? [$("div", { class: "round" }, "立論"), thinkingBubble(nextOf(cur))] : $("div", { class: "empty" }, "找不到這場"))];
  }
  const d = DATA[i];
  const status = isCur ? cur.status : d.status;
  const who = [...new Set(d.rounds.flatMap((r) => r.msgs.map((m) => m.who)))];
  const head = $("div", { class: "card" },
    $("div", { class: "meta" }, d.time, isCur ? "・" + progressText(cur) : null),
    $("div", { class: "topic" }, d.title),
    $("div", { class: "roster" }, who.map((n) => $("span", { class: "tag", style: "--c:" + color(n) }, n)),
      status !== "ended" ? statusPill(status) : null),
    scoreboard(d.totals));
  let lastStage = null;
  if (d.raw) {
    head.append($("div", { class: "raw" }, rich(d.raw)));
  } else {
    const entries = d.rounds.flatMap((r) =>
      (r.items || r.msgs.map((m) => ({ type: "msg", ...m }))).map((x) => ({ stage: r.name, x })));
    entries.forEach(({ stage, x }) => {
      if (stage !== lastStage) { head.append($("div", { class: "round" }, stage)); lastStage = stage; }
      head.append(x.type === "score" ? scoreCard(x) : bubble(x, citeIndex(d, x), isBest(d, x)));
    });
  }
  if (isCur && (status === "running" || status === "ending")) {
    const n = nextOf(cur);
    if (n.stage && n.stage !== lastStage) head.append($("div", { class: "round" }, n.kind === "verdict" ? "評審判決" : n.stage));
    head.append(thinkingBubble(n));
  }
  const out = [$("a", { class: "back", href: "#/" }, "← 回列表"), head];
  if (isCur && status !== "ended") {
    out.push($("div", { class: "card" }, statusNote(cur, "live"), controlButtons(cur)));
  } else if (status === "stopped") {
    out.push($("div", { class: "card live" }, "這場沒打完就換題了"));
  }
  if (d.verdict) out.push(verdictCard(d, id));
  // 同題再戰：這場是哪場的再戰、這場有沒有被再戰
  const parent = d.rematch ? DATA.find((x) => x.id === d.rematch) : null;
  const children = DATA.filter((x) => x.rematch === d.id);
  if (parent || children.length) {
    const res = (x) => (x.winner ? (x.winner === "平手" ? "平手" : x.winner + "勝") + (x.split ? " " + x.split : "") : "還沒結束");
    out.push($("div", { class: "card" }, $("h2", { class: "h" }, "同題對照"),
      parent ? $("a", { class: "item", href: "#/d/" + parent.id }, $("div", { class: "t" }, "上一場：" + res(parent)), $("div", { class: "m" }, parent.time)) : null,
      $("div", { class: "item" }, $("div", { class: "t" }, "這一場：" + res(d)), $("div", { class: "m" }, d.time)),
      children.map((c) => $("a", { class: "item", href: "#/d/" + c.id }, $("div", { class: "t" }, "再戰：" + res(c)), $("div", { class: "m" }, c.time)))));
  }
  if (status === "ended" && getToken() && d.rounds.length) {
    out.push($("div", { class: "row" }, $("button", { class: "btn", disabled: BUSY, onclick: () => rematch(d) }, "同題再打一場")));
  }
  const newer = DATA[i - 1], older = DATA[i + 1];
  out.push($("div", { class: "nav" },
    $("a", { href: newer ? "#/d/" + newer.id : "#/", class: newer ? "" : "off" }, "← 較新一場"),
    $("a", { href: older ? "#/d/" + older.id : "#/", class: older ? "" : "off" }, "較舊一場 →")));
  return out;
}

function render(force = true) {
  // 自動更新時，如果正在打字就先不重畫，免得鍵盤被收起來
  const a = document.activeElement;
  if (!force && a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName) && document.getElementById("app").contains(a)) return;
  const m = location.hash.match(/^#\/d\/(.+)$/);
  const parts = m ? detailView(decodeURIComponent(m[1])) : listView();
  document.getElementById("app").replaceChildren(...parts.flat().filter(Boolean));
  renderQuota();
}

// 有權杖：直接從 GitHub 讀最新的 data.json（不用等網站部署，最即時）
// 沒權杖：讀網站上的 data.json（要等部署，慢一點）
async function load(force = true) {
  let json = null;
  if (getToken()) {
    try {
      const [data, runs] = await Promise.all([
        gh("/contents/site/data.json?ref=main", {}, true),
        gh("/actions/workflows/" + WORKFLOW + "/runs?per_page=100"),
      ]);
      json = data;
      // 每一場取最近一次執行（執行名稱是「擂台 <id>」，清單新的在前）
      RUNS = {};
      (runs.workflow_runs || []).forEach((r) => {
        const m = /^擂台 (\S+)$/.exec(r.display_title || "");
        if (m && !RUNS[m[1]]) RUNS[m[1]] = r;
      });
    } catch (e) {
      NOTE = { text: e.message, kind: "err" };
    }
  }
  if (!json) {
    try {
      const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      json = await res.json();
    } catch (e) {
      NOTE = { text: "資料讀取失敗，稍後重新整理", kind: "err" };
    }
  }
  if (json) {
    DATA = json.debates || [];
    LIVE = Array.isArray(json.live) ? json.live : json.live ? [json.live] : [];
    QUOTA = json.quota || null;
  }
  render(force);
}

// 有場次在進行就每 10 秒更新一次
let timer = null;
function schedulePoll(delay = POLL_MS) {
  clearTimeout(timer);
  if (actives().some((v) => v.status === "running" || v.status === "ending")) {
    timer = setTimeout(async () => { await load(false); schedulePoll(); }, delay);
  }
}

addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(false).then(() => schedulePoll()); });
load().then(() => schedulePoll());
</script>
