name: AI 吵架擂台

# 由網頁的「開始／暫停／繼續／結束」觸發：網頁先改 control.json，再呼叫這裡。
# 每次只做一步（打一回合、結算，或只把狀態更新到網頁），
# 還要繼續就自己再觸發一次，直到暫停、結束或打滿回合上限。
# 手動也可以：Actions → AI 吵架擂台 → Run workflow（會照 control.json 接著打）。
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 讓這裡能觸發下一回合

concurrency:
  group: arena
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 拿執行當下最新的 control.json

      - name: 判斷這一步要做什麼
        id: plan
        run: echo "action=$(python3 scripts/step.py plan)" | tee -a "$GITHUB_OUTPUT"

      - name: 安裝 Claude Code
        if: steps.plan.outputs.action == 'round' || steps.plan.outputs.action == 'verdict'
        run: npm install -g @anthropic-ai/claude-code --silent

      - name: 開吵
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 scripts/step.py run

      - name: 轉檔並存檔
        id: save
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          # 先拿最新的 control.json（打這回合時網頁可能按了暫停），狀態才會對
          git pull --rebase --autostash -q
          python3 scripts/build.py
          git add debates README.md site/data.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "擂台進度"
          git push -q || { git pull --rebase -q && git push -q; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 還要繼續就觸發下一步
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase -q
          NEXT=$(python3 scripts/step.py plan)
          echo "下一步：$NEXT"
          if [ "$NEXT" != "none" ]; then
            gh workflow run arena.yml --ref main
          fi

  # 有新進度就把 site/ 部署到 GitHub Pages
  publish:
    needs: step
    if: needs.step.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
