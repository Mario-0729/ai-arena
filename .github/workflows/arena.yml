name: AI 吵架擂台

# 由網頁的「開始／暫停／繼續／結束」觸發：網頁先改 control.json，再呼叫這裡。
# 每次只做一步（正方或反方講一段、結算，或只把狀態更新到網頁），有新進度就觸發「部署網頁」，
# 還要繼續就自己再觸發一次，直到暫停、結束或打滿回合上限（無限模式要按結束才停）。
# 手動也可以：Actions → AI 吵架擂台 → Run workflow（會照 control.json 接著打）。
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 讓這裡能觸發下一回合

concurrency:
  group: arena
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 拿執行當下最新的 control.json

      - name: 判斷這一步要做什麼
        id: plan
        run: echo "action=$(python3 scripts/step.py plan)" | tee -a "$GITHUB_OUTPUT"

      - name: 安裝 Claude Code
        if: contains(fromJSON('["pro", "con", "verdict"]'), steps.plan.outputs.action)
        run: npm install -g @anthropic-ai/claude-code --silent

      - name: 開吵
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 scripts/step.py run

      - name: 轉檔並存檔
        id: save
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          # 先拿最新的 control.json（打這回合時網頁可能按了暫停），狀態才會對
          git pull --rebase --autostash -q
          python3 scripts/build.py
          git add debates README.md site/data.json $(ls quota.json 2>/dev/null)
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "擂台進度"
          git push -q || { git pull --rebase -q && git push -q; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 有新進度就請「部署網頁」更新網站
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: 還要繼續就觸發下一步
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase -q
          NEXT=$(python3 scripts/step.py plan)
          echo "下一步：$NEXT"
          if [ "$NEXT" != "none" ]; then
            gh workflow run arena.yml --ref main
          fi

