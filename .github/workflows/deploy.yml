name: 部署網頁

# 改了網頁或轉檔腳本就重新部署到 GitHub Pages；也可以在 Actions 手動按 Run workflow
# （辯論流程用 GITHUB_TOKEN 推的 commit 不會觸發這裡，那邊自己會部署）
on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 轉檔
        run: python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
