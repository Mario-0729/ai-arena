name: 部署網頁

# 部署到 GitHub Pages。三種情況會跑：
# 1. 改了網頁或轉檔腳本推上 main
# 2. 辯論流程每打完一步會觸發這裡
# 3. 手動：Actions → 部署網頁 → Run workflow
on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 排隊中的部署會被更新的取代，只會部署最新的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 轉檔
        run: python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
